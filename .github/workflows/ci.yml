name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-python-311:
    name: Python 3.11 / Spark-independent contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install unit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Test full-suite collection without optional PySpark
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('pyspark') is None"
          python -m pytest -q

  test:
    name: Python ${{ matrix.python }} / PySpark ${{ matrix.pyspark }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise audited runtime boundary pairings. A diagonal matrix hid incompatibilities caused
        # by Python and the JVM shipping different Unicode versions; Python 3.13 is exercised on the
        # current Spark line while the 3.5 floor retains the cross-version Python 3.12 pairing.
        python: ["3.10", "3.12", "3.13"]
        pyspark: ["3.5.0", "4.1.1"]
        exclude:
          - python: "3.13"
            pyspark: "3.5.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "pyspark==${{ matrix.pyspark }}" build packaging ruff

      - name: Lint
        run: python -m ruff check .

      - name: Test with a required Spark runtime
        env:
          SPARK_PARSER_REQUIRE_JAVA: "1"
        run: |
          python -m coverage run --branch -m pytest -q
          python -m coverage report --fail-under=90

      - name: Build distributions
        run: python -m build

      - name: Smoke-test the installed wheel without PySpark
        run: |
          python -m venv "$RUNNER_TEMP/spark-parser-wheel-smoke"
          "$RUNNER_TEMP/spark-parser-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/spark-parser-wheel-smoke/bin/python" -I - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          import spark_parser
          from spark_parser import parser

          assert Path(spark_parser.__file__).is_relative_to(Path(sys.prefix))
          assert importlib.util.find_spec("pyspark") is None
          config = parser.compile_mapping({
              "parser_config_id": "wheel-smoke",
              "parser_config_name": "Installed wheel smoke",
              "version": "1",
              "columns": [{
                  "source_column_name": "raw",
                  "target_column_name": "Amount",
                  "expected_data_type": "numeric(8,2)",
                  "parser": "decimal",
              }],
          })
          resolved = parser.to_mapping(config)
          assert parser.compile_mapping(resolved) == config
          assert json.loads(parser.canonical_json(config)) == resolved
          report = parser.review_yaml(resolved)
          assert report.is_valid
          assert report.summary["content_hash"] == parser.content_hash(config)
          assert "Canonical resolved configuration" in report.to_markdown()
          assert len(parser.describe()) == 13
          PY

      - name: Verify PySpark is optional in wheel metadata
        run: >-
          python -c "import glob, zipfile; from email.parser import Parser;
          from packaging.requirements import Requirement;
          p=glob.glob('dist/*.whl'); assert len(p)==1, p;
          z=zipfile.ZipFile(p[0]); n=next(x for x in z.namelist() if x.endswith('.dist-info/METADATA'));
          m=Parser().parsestr(z.read(n).decode());
          requirements=[Requirement(x) for x in m.get_all('Requires-Dist', [])];
          r=[x for x in requirements if x.name.lower() == 'pyspark'];
          assert r and all(x.marker is not None and x.marker.evaluate({'extra': 'spark'})
          and not x.marker.evaluate({'extra': ''}) for x in r), r"

      - name: Verify source distribution excludes local state
        run: >-
          python -c "import glob, tarfile;
          p=glob.glob('dist/*.tar.gz'); assert len(p)==1, p;
          names=tarfile.open(p[0]).getnames();
          forbidden=('/.claude/', '/.coverage', '/.git/', '/.review-', '/.test-tmp');
          leaked=[x for x in names if any(marker in x for marker in forbidden)];
          assert not leaked, leaked"
