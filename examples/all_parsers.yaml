# Spark Parser complete YAML argument reference.
#
# Indicators:
#   [required]               must be supplied
#   [optional; default: X]   may be omitted; X is materialized by the compiler
#   [conditionally required] required only under the condition stated
# In every column block, source_column_name, silver_column_name,
# expected_data_type, parser, and mapping-form type are [required]. Every other
# uncommented parser option is [optional] and is set to its displayed compiler
# default. Commented default_on_* lines are [conditionally required], have no
# default, and show an example typed value.

parser_config_id: bronze_all_parsers       # [required] Stable configuration ID.
parser_config_name: All Parser Arguments   # [required] Human-readable name.
version: 1.0.0                             # [required] Non-empty string version.
description: Every parser argument and default.  # [optional; default: null]
owner: Data Engineering                    # [optional; default: null]
owner_department: Enterprise Data          # [optional; default: null]

globals:                                   # [optional; default: {}]
  null_markers: []                         # [optional; default: []]
  null_marker_case_sensitive: true         # [optional; default: true]
  true_values: ["true"]                    # [optional; default: ["true"]]
  false_values: ["false"]                  # [optional; default: ["false"]]
  boolean_case_sensitive: false            # [optional; default: false]

columns:                                   # [required] Non-empty ordered list.
  # String parser
  - source_column_name: string_value       # [required] Exact top-level bronze name.
    silver_column_name: StringValue        # [required] Non-empty, unique silver name.
    expected_data_type: string             # [required] Exact target Spark datatype.
    parser:                                # [required] Mapping or scalar `string`.
      type: string                         # [required in mapping form]
      collapse_whitespace: true            # [optional; default: true]
      trim_whitespace: true                # [optional; default: true]
      empty_is_null: true                  # [optional; default: true]
      replace_null_markers: false          # [optional; default: false]
      null_markers: []                     # [optional; default: inherited globals]
      null_markers_mode: replace           # [optional; default: replace; replace|extend]
      null_marker_case_sensitive: true     # [optional; default: inherited global]
      is_nullable: true                    # [optional; default: true]
      # default_on_null: UNKNOWN           # [conditionally required if is_nullable: false]
      on_parse_error: fail                 # [optional; default: fail; fail|null|default|preserve]
      # default_on_error: UNKNOWN          # [conditionally required for on_parse_error: default]
      audit: false                         # [optional; default: false]
      # Allowed: null|lower|upper|title|pascal|address_us_v1|county|state_us|zip
      format: null                         # [optional; default: null]

  # Byte parser (`tinyint` is an accepted alias).
  - source_column_name: byte_value
    silver_column_name: ByteValue
    expected_data_type: byte
    parser:
      type: byte
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 0
      on_parse_error: fail
      # default_on_error: 0
      audit: false
      zero_is_valid: true

  # Short parser (`smallint` is an accepted alias).
  - source_column_name: short_value
    silver_column_name: ShortValue
    expected_data_type: short
    parser:
      type: short
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 0
      on_parse_error: fail
      # default_on_error: 0
      audit: false
      zero_is_valid: true

  # Integer parser (`expected_data_type: int` and `type: int` are accepted aliases).
  - source_column_name: integer_value
    silver_column_name: IntegerValue
    expected_data_type: integer
    parser:
      type: integer
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 0                 # [conditionally required if is_nullable: false]
      on_parse_error: fail
      # default_on_error: 0                # [conditionally required for on_parse_error: default]
      audit: false
      zero_is_valid: true                  # [optional; default: true]
      # When zero_is_valid is false, neither default_on_null nor default_on_error may be zero.

  # Long parser (`expected_data_type: bigint` and `type: bigint` are accepted aliases).
  - source_column_name: long_value
    silver_column_name: LongValue
    expected_data_type: long
    parser:
      type: long
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 0
      on_parse_error: fail
      # default_on_error: 0
      audit: false
      zero_is_valid: true

  # Float parser (`real` is an accepted alias).
  - source_column_name: float_value
    silver_column_name: FloatValue
    expected_data_type: float
    parser:
      type: float
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 0.0
      on_parse_error: fail
      # default_on_error: 0.0
      audit: false
      zero_is_valid: true

  # Decimal parser. Precision and scale are required; there is no datatype default.
  - source_column_name: decimal_value
    silver_column_name: DecimalValue
    expected_data_type: decimal(18,2)
    parser:
      type: decimal
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: "0.00"
      on_parse_error: fail
      # default_on_error: "0.00"
      audit: false
      zero_is_valid: true

  # Double parser
  - source_column_name: double_value
    silver_column_name: DoubleValue
    expected_data_type: double
    parser:
      type: double
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 0.0
      on_parse_error: fail
      # default_on_error: 0.0
      audit: false
      zero_is_valid: true

  # Binary parser. Audit values are always rendered as canonical base64.
  - source_column_name: binary_value
    silver_column_name: BinaryValue
    expected_data_type: binary
    parser:
      type: binary
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: U3BhcmsgUGFyc2Vy
      on_parse_error: fail
      # default_on_error: U3BhcmsgUGFyc2Vy
      audit: false
      encoding: base64                     # [optional; default: base64; base64|hex|utf8]

  # Boolean parser
  - source_column_name: boolean_value
    silver_column_name: BooleanValue
    expected_data_type: boolean
    parser:
      type: boolean
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: false
      on_parse_error: fail
      # default_on_error: false
      audit: false
      true_values: ["true"]                 # [optional; default: ["true"]]
      false_values: ["false"]               # [optional; default: ["false"]]
      boolean_values_mode: replace           # [optional; default: replace; replace|extend]
      boolean_case_sensitive: false         # [optional; default: false]

  # Date parser. Formats cascade in list order; the first successful parse wins.
  - source_column_name: date_value
    silver_column_name: DateValue
    expected_data_type: date
    parser:
      type: date
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 1970-01-01
      on_parse_error: fail
      # default_on_error: 1970-01-01
      audit: false
      # US month-first defaults accept timestamps both with and without seconds.
      formats: [yyyy-MM-dd, "MM/dd/yyyy hh:mm a", "MM/dd/yyyy hh:mm:ss a"] # [optional]

  # Timestamp parser. Formats cascade in list order; the first successful parse wins.
  - source_column_name: timestamp_value
    silver_column_name: TimestampValue
    expected_data_type: timestamp
    parser:
      type: timestamp
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 1970-01-01T00:00:00
      on_parse_error: fail
      # default_on_error: 1970-01-01T00:00:00
      audit: false
      # US month-first defaults accept timestamps both with and without seconds.
      formats: [yyyy-MM-dd HH:mm:ss, "MM/dd/yyyy hh:mm a", "MM/dd/yyyy hh:mm:ss a"] # [optional]

  # Timestamp without timezone. Represents local wall-clock time.
  - source_column_name: timestamp_ntz_value
    silver_column_name: TimestampNtzValue
    expected_data_type: timestamp_ntz
    parser:
      type: timestamp_ntz
      collapse_whitespace: true
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: 1970-01-01T00:00:00
      on_parse_error: fail
      # default_on_error: 1970-01-01T00:00:00
      audit: false
      # US month-first defaults accept timestamps both with and without seconds.
      formats: [yyyy-MM-dd HH:mm:ss, "MM/dd/yyyy hh:mm a", "MM/dd/yyyy hh:mm:ss a"] # [optional]

  # Array parser. JSON supports recursive element types; delimited supports scalar elements.
  - source_column_name: array_value
    silver_column_name: ArrayValue
    expected_data_type: array<string>
    parser:
      type: array
      collapse_whitespace: false           # [resolved: false for outer complex containers]
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: []
      on_parse_error: fail
      # default_on_error: []
      audit: false
      input_format: json                    # [optional; default: json; json|delimited]
      # delimiter: ","                     # [conditionally required for delimited input]
      element_parser:                       # [required] Recursive parser matching array<T>.
        type: string
        format: null
      on_element_error: fail                # [optional; fail|null|drop|preserve for string child]
      drop_null_elements: false             # [optional; default: false]
      distinct: false                       # [optional; default: false]

  # Struct parser. Every target field must have one source-to-silver mapping.
  - source_column_name: struct_value
    silver_column_name: StructValue
    expected_data_type: struct<name:string,zip:string>
    parser:
      type: struct
      collapse_whitespace: false           # [resolved: false for outer complex containers]
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: {name: UNKNOWN, zip: "00000"}
      on_parse_error: fail
      # default_on_error: {name: UNKNOWN, zip: "00000"}
      audit: false
      input_format: json                    # [optional; default: json; JSON only]
      fields:                               # [required] Complete recursive field list.
        - source_field_name: name
          silver_field_name: name
          parser:
            type: string
            format: null
        - source_field_name: postal_code
          silver_field_name: zip
          parser:
            type: string
            format: zip
            on_parse_error: null

  # Map parser. JSON input currently requires string keys.
  - source_column_name: map_value
    silver_column_name: MapValue
    expected_data_type: map<string,decimal(18,2)>
    parser:
      type: map
      collapse_whitespace: false           # [resolved: false for outer complex containers]
      trim_whitespace: true
      empty_is_null: true
      replace_null_markers: false
      null_markers: []
      null_markers_mode: replace
      null_marker_case_sensitive: true
      is_nullable: true
      # default_on_null: {}
      on_parse_error: fail
      # default_on_error: {}
      audit: false
      input_format: json                    # [optional; default: json; JSON only]
      value_parser: decimal                 # [required] Recursive parser matching map value type.
      on_value_error: fail                  # [optional; fail|null|drop|preserve for string child]
      drop_null_values: false               # [optional; default: false]
