[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spark-parser"
dynamic = ["version"]
description = "Strict YAML parsing of bronze strings into scalar Spark types."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Matt Arbaiza"}]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5",
]
test = [
    "coverage[toml]>=7",
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/arbaizam/spark_parsing_engine"

[tool.hatch.version]
path = "src/spark_parser/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_parser"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/docs",
    "/examples",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "spark: tests that start a local Spark runtime and require Java",
    "classic_spark: tests requiring SparkContext or mutable internal SQL configuration",
]

[tool.coverage.run]
branch = true
source = ["spark_parser"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "C90", "DTZ", "FURB"]

[tool.ruff.lint.mccabe]
max-complexity = 20
