[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-parser"
dynamic = ["version"]
description = "Strict YAML parsing of bronze strings into scalar and complex Spark types."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Matt Arbaiza"}]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5",
]
test = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/arbaizam/spark_parsing_engine"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spark_parser*"]

[tool.setuptools.dynamic]
version = {attr = "spark_parser.version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "spark: tests that start a local Spark runtime and require Java",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "C90", "DTZ", "FURB"]

[tool.ruff.lint.mccabe]
max-complexity = 20
