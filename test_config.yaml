parser_config_id: bronze_positions_to_target
parser_config_name: Bronze Positions Parser
version: 1.0.0
owner: Data Engineering
owner_department: Enterprise Data
description: Example load-specific parsing configuration.

globals:
  null_markers: [NA, "Null"]
  null_marker_case_sensitive: true
  true_values: ["true", Y, "yes"]
  false_values: ["false", N, "no"]
  boolean_case_sensitive: false

columns:
  - source_column_name: column_name1
    target_column_name: ColumnName1
    expected_data_type: string
    parser:
      type: string
      format: pascal
      replace_null_markers: true
      null_markers: [N/A]
      null_markers_mode: extend
      audit: true

  - source_column_name: column_name2
    target_column_name: ColumnName2
    expected_data_type: integer
    parser:
      type: integer
      replace_null_markers: true
      is_nullable: false
      default_on_null: -1
      zero_is_valid: false
      audit: true

  - source_column_name: column_name3
    target_column_name: ColumnName3
    expected_data_type: decimal(38,32)
    parser:
      type: decimal
      replace_null_markers: true
      zero_is_valid: true
      audit: true

  - source_column_name: column_name5
    target_column_name: ColumnName5
    expected_data_type: date
    parser:
      type: date
      formats: [yyyy-MM-dd]
      replace_null_markers: true
      is_nullable: true
